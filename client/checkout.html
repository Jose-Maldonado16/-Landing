<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalizar Pedido — DulceMania 🍦</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/checkout.css" />
</head>
<body class="dashboard-body">

  <header class="dash-navbar">
    <div class="container dash-navbar__container">
      <a href="/client/dashboard.html" class="dash-brand">
        <span class="dash-brand-icon">🍦</span>
        <span class="dash-brand-text">Dulce<span class="dash-brand-accent">Mania</span></span>
      </a>
      <a href="/client/dashboard.html" class="btn btn--outline btn--sm">← Volver al Menú</a>
    </div>
  </header>

  <main class="container checkout-main">
    <h1 class="dash-title">Finalizar Pedido</h1>
    <p class="dash-subtitle">Solo un paso más para disfrutar tu antojo.</p>

    <form id="checkoutForm" class="checkout-grid">
      
      <div class="checkout-form-col">
        
        <!-- Tipo de entrega -->
        <section class="checkout-section">
          <h2>1. Tipo de entrega</h2>
          <div class="radio-group">
            <label class="radio-card">
              <input type="radio" name="deliveryType" value="recojo" checked>
              <div class="radio-content">
                <span class="radio-icon">🏪</span>
                <div>
                  <strong>Recojo en tienda</strong>
                  <span>Pasa a recoger tu pedido</span>
                </div>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="deliveryType" value="domicilio">
              <div class="radio-content">
                <span class="radio-icon">🛵</span>
                <div>
                  <strong>Entrega a domicilio</strong>
                  <span>Te lo llevamos a tu puerta</span>
                </div>
              </div>
            </label>
          </div>
          
          <div id="addressField" class="checkout-field hidden">
            <label for="deliveryAddress">Dirección de entrega *</label>
            <input type="text" id="deliveryAddress" placeholder="Ej: Calle Bolívar #123, Sucre" />
          </div>
        </section>

        <!-- Fecha y hora -->
        <section class="checkout-section">
          <h2>2. ¿Cuándo lo quieres?</h2>
          <p class="checkout-hint">Máximo 3 días de anticipación.</p>
          <div class="checkout-row">
            <div class="checkout-field">
              <label for="scheduleDate">Fecha *</label>
              <input type="date" id="scheduleDate" required />
            </div>
            <div class="checkout-field">
              <label for="scheduleTime">Hora *</label>
              <input type="time" id="scheduleTime" required />
            </div>
          </div>
        </section>

        <!-- Método de pago -->
        <section class="checkout-section">
          <h2>3. Método de pago</h2>
          <div class="payment-grid">
            <label class="payment-card">
              <input type="radio" name="paymentMethod" value="qr" checked>
              <div class="payment-content">
                <span>📱</span> QR
              </div>
            </label>
            <label class="payment-card">
              <input type="radio" name="paymentMethod" value="tarjeta">
              <div class="payment-content">
                <span>💳</span> Tarjeta
              </div>
            </label>
            <label class="payment-card">
              <input type="radio" name="paymentMethod" value="efectivo">
              <div class="payment-content">
                <span>💵</span> Efectivo
              </div>
            </label>
          </div>
        </section>

        <!-- Notas -->
        <section class="checkout-section">
          <h2>4. Personalización (opcional)</h2>
          <div class="checkout-field">
            <label for="orderNotes">Notas para tu pedido</label>
            <textarea id="orderNotes" rows="2" placeholder="Ej: Sin azúcar, mensaje especial..."></textarea>
          </div>
        </section>

        <!-- ERROR -->
        <div id="checkoutError" class="auth-error hidden" style="margin-bottom: 1rem;"></div>
      </div>

      <!-- Resumen -->
      <aside class="checkout-summary-col">
        <div class="checkout-summary">
          <h2>Resumen del pedido</h2>
          <div id="summaryItems" class="summary-items"></div>
          <div class="summary-totals">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="summarySubtotal">Bs. 0.00</span>
            </div>
            <div class="summary-row summary-row--total">
              <span>Total a pagar</span>
              <strong id="summaryTotal">Bs. 0.00</strong>
            </div>
          </div>
          <button type="submit" id="btnConfirmOrder" class="btn btn--primary btn--block">
            Confirmar Pedido
          </button>
        </div>
      </aside>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/client/checkout.js"></script>
</body>
</html>
